[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  included_files = ["private/**"]

# Keep the paid PDFs and function source from being served as plain files
[[redirects]]
  from = "/private/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
